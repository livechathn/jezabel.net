<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://sar1a.lempyra.com; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
<title>jezabel.net — ssh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'JetBrains Mono',monospace;
  background:#000;
  color:#00ff41;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
/* grid bg */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,255,65,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,65,.03) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}
/* scanlines */
body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.1) 2px,rgba(0,0,0,.1) 4px);
  pointer-events:none;z-index:100;
}
.ssh-window{
  width:min(560px,96vw);
  border:1px solid #003a0f;
  background:#030a04;
  box-shadow:0 0 80px rgba(0,255,65,.05),inset 0 0 60px rgba(0,0,0,.4);
}
.ssh-bar{
  background:#000;
  border-bottom:1px solid #003a0f;
  padding:8px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:10px;
  letter-spacing:1px;
  color:#1a4a1a;
}
.dot{width:8px;height:8px;border-radius:50%;}
.dot.r{background:#1a0808;}
.dot.y{background:#1a1408;}
.dot.g{background:#083a08;}
.ssh-title{margin:0 auto;color:#00ff41;letter-spacing:3px;font-size:11px;}
.ssh-body{padding:24px 28px 28px;}
.ssh-header{
  font-size:11px;
  color:#1a4a1a;
  letter-spacing:.5px;
  line-height:1.8;
  margin-bottom:20px;
  border-bottom:1px solid #0a1a0a;
  padding-bottom:14px;
}
.ssh-header .hi{color:#00ff41;}
.ssh-header .warn{color:#cc6600;}
.field{margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.field-label{color:#1a7a1a;font-size:13px;white-space:nowrap;letter-spacing:1px;}
input[type=text],input[type=password]{
  flex:1;
  background:transparent;
  border:none;
  border-bottom:1px solid #0a2a0a;
  color:#00ff41;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  padding:6px 4px;
  outline:none;
  letter-spacing:1px;
  caret-color:#00ff41;
}
input:focus{border-bottom-color:#00ff41;}
.btn{
  width:100%;
  background:transparent;
  border:1px solid #00ff41;
  color:#00ff41;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:3px;
  padding:10px;
  cursor:pointer;
  margin-top:20px;
  text-transform:uppercase;
  transition:background .2s,color .2s;
}
.btn:hover{background:#00ff41;color:#000;}
.btn:disabled{opacity:.3;cursor:not-allowed;}
.status{
  margin-top:14px;
  font-size:11px;
  letter-spacing:.5px;
  min-height:16px;
  line-height:1.6;
  white-space:pre;
}
.status.err{color:#cc3333;}
.status.ok{color:#00ff41;}
.status.dim{color:#1a5a1a;}
.blink{animation:blink .8s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
.back{display:block;text-align:center;margin-top:18px;font-size:10px;color:#0a2a0a;text-decoration:none;letter-spacing:1px;}
.back:hover{color:#1a5a1a;}
</style>
</head>
<body>
<div class="ssh-window">
  <div class="ssh-bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="ssh-title">jezabel.net — ssh</span>
  </div>
  <div class="ssh-body">
    <div class="ssh-header">
      <div class="hi">SSH-2.0-jezabel_codex_v2.7.1</div>
      <div class="warn">Warning: This system is for authorized users only.</div>
      <div>All access is monitored and logged.</div>
    </div>
    <div class="field">
      <span class="field-label">login:</span>
      <input type="text" id="u" autocomplete="username" autofocus placeholder="_">
    </div>
    <div class="field">
      <span class="field-label">password:</span>
      <input type="password" id="p" autocomplete="current-password" placeholder="_">
    </div>
    <button class="btn" id="btn" onclick="doLogin()">[ authenticate ]</button>
    <div class="status dim" id="status">&nbsp;</div>
    <a href="../" class="back">← back to jezabel.net</a>
  </div>
</div>

<script>
var AUTH={
  url:'https://sar1a.lempyra.com',
  clientId:'portal',
  scope:'read,write,code',
  tokenKey:'jezabel_token',
  userKey:'jezabel_user'
};
(function(){
  if(sessionStorage.getItem(AUTH.tokenKey)) window.location.replace('../dashboard/');
})();
document.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});

async function doLogin(){
  var u=document.getElementById('u').value.trim();
  var p=document.getElementById('p').value;
  var btn=document.getElementById('btn');
  var st=document.getElementById('status');
  if(!u||!p){st.className='status err';st.textContent='> error: credentials required';return;}
  btn.disabled=true;
  st.className='status dim';
  st.innerHTML='> connecting to sar1a.lempyra.com<span class="blink">_</span>';
  try{
    var r1=await fetch(AUTH.url+'/auth/authorize',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,password:p,client_id:AUTH.clientId,scope:AUTH.scope})
    });
    var d1=await r1.json();
    if(!r1.ok) throw new Error(d1.detail||'authorization failed');
    var code=d1.authorization_code||d1.code;
    if(!code) throw new Error('no code returned');
    st.innerHTML='> handshake accepted — exchanging token<span class="blink">_</span>';
    var r2=await fetch(AUTH.url+'/auth/token',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({grant_type:'authorization_code',code:code,client_id:AUTH.clientId,client_secret:p})
    });
    var d2=await r2.json();
    if(!r2.ok) throw new Error(d2.detail||'token exchange failed');
    sessionStorage.setItem(AUTH.tokenKey,d2.access_token);
    sessionStorage.setItem(AUTH.userKey,JSON.stringify({username:u}));
    st.className='status ok';
    st.textContent='> access granted\n> loading codex...';
    setTimeout(function(){window.location.replace('../dashboard/');},700);
  }catch(e){
    st.className='status err';
    st.textContent='> authentication failed: '+e.message;
    btn.disabled=false;
  }
}
</script>
</body>
</html>
