<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>jezabel.net · USERS</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050008; --bg2:#0a000f; --bg3:#0d0015;
  --mg:#ff00ff; --mg2:#8800aa; --gr:#00ff41; --cy:#00ccff;
  --fg:#e8d8ff; --dim:#4a1a6a; --dim2:#2a0a3a; --border:#1a0828;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;}
body{
  font-family:'JetBrains Mono',monospace;
  background:var(--bg);color:var(--fg);
  font-size:13px;line-height:1.4;overflow:hidden;
}
body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);
  pointer-events:none;z-index:8000;
}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;background:rgba(0,0,0,0.6);color:var(--fg);border:1px solid var(--border);padding:8px;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--mg);box-shadow:0 0 10px rgba(255,0,255,0.2)}

/* TOP BAR */
.topbar{
  display:flex;align-items:center;gap:24px;padding:0 32px;
  background:rgba(10,0,15,0.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);height:60px;position:relative;z-index:100;
}
.brand{
  font-size:18px;letter-spacing:4px;color:var(--mg);text-decoration:none;
  text-shadow:0 0 15px rgba(255,0,255,0.4);
}
.brand .sub{font-size:9px;color:var(--dim);letter-spacing:1px;margin-left:8px;}
.bar-spacer{flex:1}
.back-link{font-size:10px;letter-spacing:2px;color:var(--gr);text-decoration:none;border:1px solid #003a0f;padding:6px 12px;}
.back-link:hover{border-color:var(--gr);background:rgba(0,255,65,0.05);}

/* MAIN */
.main{height:calc(100vh - 60px);overflow-y:auto;padding:40px;position:relative;z-index:10;}
.view{max-width:1400px;margin:0 auto}

/* ROSTER VIEW */
.roster-controls{
  display:flex;gap:20px;margin-bottom:40px;align-items:center;
  background:rgba(13,0,21,0.7);padding:20px;border:1px solid var(--border);
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
}
.search-input{
  flex:1;background:rgba(0,0,0,0.6);border:1px solid var(--dim2);
  color:var(--gr);padding:12px 20px;font-size:14px;letter-spacing:1px;
}
.search-input::placeholder{color:var(--dim2);}
.filter-group{display:flex;gap:10px;}
.chip{
  padding:8px 16px;background:rgba(0,0,0,0.4);border:1px solid var(--dim2);
  color:var(--dim);font-size:10px;letter-spacing:2px;text-transform:uppercase;transition:all 0.2s;
}
.chip:hover{border-color:var(--cy);color:var(--cy)}
.chip.active{border-color:var(--mg);color:var(--mg);background:rgba(255,0,255,0.05);box-shadow:0 0 15px rgba(255,0,255,0.1);}

.roster-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:30px;perspective:1000px;
}

/* FLOATING NODES (CARDS) */
@keyframes float {
  0% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
  33% { transform: translateY(-12px) rotateX(2deg) rotateY(-1deg); }
  66% { transform: translateY(4px) rotateX(-1deg) rotateY(2deg); }
  100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
}

@keyframes scanline {
  0% { top: -100%; }
  100% { top: 100%; }
}

.card {
  background: rgba(10, 0, 15, 0.8);
  border: 1px solid var(--border);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  overflow: hidden;
  animation: float 8s ease-in-out infinite;
  animation-delay: var(--delay);
}

.card:hover {
  border-color: var(--mg);
  background: rgba(20, 0, 30, 0.95);
  transform: scale(1.05) translateY(-10px) rotateX(5deg);
  box-shadow: 0 15px 40px rgba(255, 0, 255, 0.2);
  z-index: 50;
  animation-play-state: paused;
}

.card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
  background: var(--dim2); transition: background 0.3s;
}
.card:hover::before { background: var(--mg); }

.card-scan {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to bottom, transparent, rgba(0, 255, 65, 0.05), transparent);
  height: 20%; width: 100%; animation: scanline 3s linear infinite;
  display: none;
}
.card:hover .card-scan { display: block; }

.card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim);
}
.type-tag { color: var(--cy); border: 1px solid #003a40; padding: 2px 6px; }
.institution .type-tag { color: var(--gr); border-color: #003a0f; background: rgba(0,255,65,0.05); }

.card-name {
  font-size: 16px; font-weight: 600; letter-spacing: 1px; color: var(--fg);
  text-shadow: 0 0 10px rgba(232, 216, 255, 0.2);
}
.card-meta {
  font-size: 11px; color: var(--dim); display: flex; flex-direction: column; gap: 8px;
  background: rgba(0,0,0,0.3); padding: 10px; border: 1px solid rgba(255,0,255,0.05);
}
.card-meta span { color: var(--mg2); }
.card-meta b { color: var(--gr); font-weight: 400; }

.tier-label {
  font-size: 9px; color: var(--dim); border-top: 1px solid var(--border); padding-top: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.tier-val { padding: 2px 6px; border: 1px solid transparent; }
.tier-val.premium { color: var(--mg); border-color: rgba(255,0,255,0.2); }
.tier-val.admin { color: var(--cy); border-color: rgba(0,204,255,0.2); }

/* USER SHEET OVERLAY */
.sheet-overlay{
  position:fixed;inset:0;background:rgba(5,0,8,0.95);
  backdrop-filter:blur(15px);z-index:1000;display:none;padding:40px;overflow-y:auto;
}
.sheet-container{
  max-width:1000px;margin:40px auto;background:var(--bg2);
  border: 1px solid var(--dim2); display:grid;grid-template-columns:320px 1fr;
  min-height:600px;position:relative;
  box-shadow: 0 0 100px rgba(0,0,0,0.8), 0 0 2px var(--mg);
}
.sheet-sidebar{
  background:rgba(0,0,0,0.4);padding:40px;border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:32px;
}
.sheet-main{padding:50px;display:flex;flex-direction:column;gap:40px;}

.user-portrait{
  width:120px;height:120px;background:var(--bg);border:1px solid var(--dim2);
  display:flex;align-items:center;justify-content:center;
  font-size:50px;color:var(--mg);text-shadow:0 0 20px rgba(255,0,255,0.6);
  box-shadow: inset 0 0 20px rgba(255,0,255,0.1);
}
.sheet-actions{display:flex;flex-direction:column;gap:16px;margin-top:auto;}
.sheet-btn{
  padding:14px;border:1px solid var(--dim2);color:var(--dim);
  font-size:11px;letter-spacing:3px;text-transform:uppercase;text-align:center;transition:all 0.3s;
}
.sheet-btn:hover{border-color:var(--cy);color:var(--cy);background:rgba(0,204,255,0.05);transform:translateX(5px);}
.sheet-btn.mg{border-color:var(--mg);color:var(--mg);}
.sheet-btn.gr{border-color:var(--gr);color:var(--gr);}
.sheet-btn.gr:hover{border-color:var(--gr);color:var(--gr);background:rgba(0,255,65,0.05);}

.field-group{display:flex;flex-direction:column;gap:10px;}
.label{font-size:10px;letter-spacing:4px;color:var(--dim2);text-transform:uppercase; font-weight: 600;}
.val{font-size:16px;color:var(--fg);border-bottom:1px solid transparent;padding:4px 0;}
.editing .val{display:none;}
.rw-input{display:none;width:100%;font-size:16px;padding:8px 12px; border-color: var(--dim2);}
.editing .rw-input{display:block;}

.grid-fields{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
.notes-area{min-height:140px;resize:vertical;}

.close-btn{
  position:absolute;top:25px;right:25px;font-size:24px;color:var(--dim);
  cursor:pointer;z-index:1100;transition:all 0.3s;
}
.close-btn:hover{color:var(--mg);transform:rotate(90deg);}

/* TOAST */
.toast{
  position:fixed;bottom:32px;right:32px;padding:16px 32px;
  background:var(--bg3);border:1px solid var(--gr);color:var(--gr);
  font-size:11px;letter-spacing:3px;z-index:2000;display:none;
  box-shadow: 0 0 30px rgba(0,255,65,0.1);
}
.toast.err{border-color:var(--mg);color:var(--mg)}

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); transition: background 0.3s; }
::-webkit-scrollbar-thumb:hover { background: var(--dim); }

</style>
</head>
<body>

<div class="topbar">
  <a href="../dashboard/" class="brand">JEZABEL<span class="sub">NODE_EXPLORER</span></a>
  <div class="bar-spacer"></div>
  <a href="../dashboard/" class="back-link">[ RET_TO_CORE ]</a>
</div>

<div class="main">
  <div class="view">
    <div class="roster-controls">
      <input type="text" id="searchInput" class="search-input" placeholder="SCAN_NODES: ID, ALIAS, INSTITUTION..." oninput="renderRoster()">
      <div class="filter-group" id="typeFilters"></div>
      <div class="filter-group" id="tierFilters"></div>
    </div>

    <div class="roster-grid" id="rosterGrid"></div>
  </div>
</div>

<!-- USER SHEET OVERLAY -->
<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet-container" id="sheetContainer" onclick="event.stopPropagation()">
    <div class="close-btn" onclick="closeSheet()">[×]</div>
    <div class="sheet-sidebar">
      <div class="user-portrait" id="sheetPortrait">?</div>
      <div class="field-group">
        <span class="label">NODE_TYPE</span>
        <span class="val" id="sheetType" style="color:var(--cy)">—</span>
      </div>
      <div class="field-group">
        <span class="label">ENTRY_PLATFORM</span>
        <span class="val" id="sheetPlatform" style="color:var(--gr)">—</span>
      </div>
      <div class="field-group">
        <span class="label">EXT_ID</span>
        <span class="val" id="sheetExtId">—</span>
      </div>
      <div class="sheet-actions">
        <button class="sheet-btn" id="editBtn" onclick="toggleEdit()">[ MOD_DAE_NODE ]</button>
        <button class="sheet-btn gr" id="saveBtn" style="display:none" onclick="saveUser()">[ COMMIT_SYNC ]</button>
        <button class="sheet-btn" id="cancelBtn" style="display:none" onclick="toggleEdit(false)">[ ABORT ]</button>
      </div>
    </div>
    <div class="sheet-main">
      <div class="field-group">
        <span class="label">DISPLAY_IDENTIFIER</span>
        <span class="val" id="sheetDisplayName" style="font-size:24px; color:var(--mg)">—</span>
        <input type="text" id="editDisplayName" class="rw-input" style="font-size:24px;">
      </div>
      <div class="grid-fields">
        <div class="field-group">
          <span class="label">SYSTEM_ALIAS</span>
          <span class="val" id="sheetUsername">—</span>
        </div>
        <div class="field-group">
          <span class="label">ACCESS_TIER</span>
          <span class="val" id="sheetTier">—</span>
          <select id="editTier" class="rw-input">
            <option value="free">FREE</option>
            <option value="premium">PREMIUM</option>
            <option value="admin">ADMIN</option>
          </select>
        </div>
      </div>
      <div id="institutionFields" style="display:none">
        <div class="field-group" style="margin-bottom: 32px;">
          <span class="label">INSTITUTION_API_KEY</span>
          <div style="display:flex; gap:10px; align-items:center;">
            <span class="val" id="sheetApiKey" style="font-size:12px; font-family:'Courier New',monospace; color:var(--cy)">—</span>
            <button class="sheet-btn" style="padding:4px 8px; font-size:9px;" onclick="regenKey()">[ REGEN ]</button>
          </div>
        </div>
      </div>
      <div class="field-group">
        <span class="label">LOG_STREAM_NOTES</span>
        <div class="val" id="sheetNotes" style="white-space:pre-wrap; background:rgba(0,0,0,0.2); padding:15px; border-left:2px solid var(--dim2)">—</div>
        <textarea id="editNotes" class="rw-input notes-area"></textarea>
      </div>
      <div class="field-group" style="opacity:0.3">
        <span class="label">INTERNAL_UUID</span>
        <span class="val" id="sheetUserKey" style="font-size:10px">—</span>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="../auth-guard.js"></script>
<script src="../assets/serpent-bg.js"></script>
<script src="mock-data.js"></script>
<script>
  // ─ ADMIN BOUNCE ─
  (function(){
    var TK='jezabel_token', UK='jezabel_user';
    var ud=JSON.parse(sessionStorage.getItem(UK)||'{}');
    // IS_ADMIN logic mirrored from dashboard
    var isA=(ud.role==='admin')||(ud.tier==='admin')||(ud.id===1)||(ud.user_id===1)||(ud.sub==='master');
    if(!isA){
      alert('ADMIN_ACCESS_REQUIRED');
      window.location.replace('../dashboard/');
    }
  })();

  var currentUsers = [...MOCK_USERS];
  var filters = { type: '', tier: '' };
  var selectedUser = null;
  var isEditing = false;

  function init() {
    renderFilters();
    renderRoster();
  }

  function renderFilters() {
    var types = ['', 'person', 'institution'];
    document.getElementById('typeFilters').innerHTML = types.map(t => 
      `<button class="chip ${filters.type === t ? 'active' : ''}" onclick="setFilter('type', '${t}')">${t || 'ALL_TYPES'}</button>`
    ).join('');

    var tiers = ['', 'free', 'premium', 'admin'];
    document.getElementById('tierFilters').innerHTML = tiers.map(t => 
      `<button class="chip ${filters.tier === t ? 'active' : ''}" onclick="setFilter('tier', '${t}')">${t || 'ALL_TIERS'}</button>`
    ).join('');
  }

  function setFilter(key, val) {
    filters[key] = val;
    renderFilters();
    renderRoster();
  }

  function renderRoster() {
    var q = document.getElementById('searchInput').value.toLowerCase();
    var grid = document.getElementById('rosterGrid');
    
    var filtered = currentUsers.filter(u => {
      if (filters.type && u.type !== filters.type) return false;
      if (filters.tier && u.tier !== filters.tier) return false;
      if (q) {
        var hay = (u.username + ' ' + u.display_name + ' ' + u.ext_id + ' ' + (u.type||'')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    grid.innerHTML = filtered.map((u, i) => `
      <div class="card ${u.type === 'institution' ? 'institution' : ''}" 
           style="--delay: ${i * 0.5}s"
           onclick="openSheet('${u.platform}', '${u.ext_id}')">
        <div class="card-scan"></div>
        <div class="card-header">
          <span>${u.platform.toUpperCase()}</span>
          <span class="type-tag">${u.type ? u.type.toUpperCase() : 'NODE'}</span>
        </div>
        <div class="card-name">${u.display_name || u.username}</div>
        <div class="card-meta">
          <div>EXT_ID: <b>${u.ext_id}</b></div>
          <div>DATA_FLUX: <b>${u.msg_count.toLocaleString()}</b> units</div>
        </div>
        <div class="tier-label">
          <span>ACCESS:</span>
          <span class="tier-val ${u.tier}">${u.tier.toUpperCase()}</span>
        </div>
      </div>
    `).join('');
  }

  function openSheet(platform, extId) {
    selectedUser = currentUsers.find(u => u.platform === platform && u.ext_id === extId);
    if (!selectedUser) return;

    document.getElementById('sheetPortrait').textContent = (selectedUser.display_name || selectedUser.username || '?').charAt(0).toUpperCase();
    document.getElementById('sheetType').textContent = (selectedUser.type || 'person').toUpperCase();
    document.getElementById('sheetPlatform').textContent = selectedUser.platform.toUpperCase();
    document.getElementById('sheetExtId').textContent = selectedUser.ext_id;
    document.getElementById('sheetDisplayName').textContent = selectedUser.display_name || '—';
    document.getElementById('sheetUsername').textContent = selectedUser.username || '—';
    document.getElementById('sheetTier').textContent = selectedUser.tier.toUpperCase();
    document.getElementById('sheetNotes').textContent = selectedUser.notes || '—';
    document.getElementById('sheetUserKey').textContent = selectedUser.user_key || '—';

    // Institution specific
    var instFields = document.getElementById('institutionFields');
    if (selectedUser.type === 'institution') {
      instFields.style.display = 'block';
      document.getElementById('sheetApiKey').textContent = selectedUser.user_key || 'AK_GENERATING_...';
    } else {
      instFields.style.display = 'none';
    }

    document.getElementById('editDisplayName').value = selectedUser.display_name || '';
    document.getElementById('editTier').value = selectedUser.tier;
    document.getElementById('editNotes').value = selectedUser.notes || '';

    document.getElementById('sheetOverlay').style.display = 'block';
  }

  function closeSheet() {
    if (isEditing) {
      if (!confirm('Abort data commit?')) return;
      toggleEdit(false);
    }
    document.getElementById('sheetOverlay').style.display = 'none';
  }

  function toggleEdit(on) {
    isEditing = (on !== undefined) ? on : !isEditing;
    var container = document.getElementById('sheetContainer');
    if (isEditing) container.classList.add('editing');
    else container.classList.remove('editing');

    document.getElementById('editBtn').style.display = isEditing ? 'none' : 'block';
    document.getElementById('saveBtn').style.display = isEditing ? 'block' : 'none';
    document.getElementById('cancelBtn').style.display = isEditing ? 'block' : 'none';
  }

  function saveUser() {
    if (!selectedUser) return;
    showToast('COMMIT_IN_PROGRESS...', 'err');
    setTimeout(() => {
      selectedUser.display_name = document.getElementById('editDisplayName').value;
      selectedUser.tier = document.getElementById('editTier').value;
      selectedUser.notes = document.getElementById('editNotes').value;
      showToast('NODE_STATE_SYNCED', 'ok');
      toggleEdit(false);
      openSheet(selectedUser.platform, selectedUser.ext_id);
      renderRoster();
    }, 800);
  }

  function regenKey() {
    showToast('REGENERATING_API_KEY...', 'err');
    setTimeout(() => {
      var newKey = 'ak_' + Math.random().toString(36).substring(2, 15);
      selectedUser.user_key = newKey;
      document.getElementById('sheetApiKey').textContent = newKey;
      showToast('NEW_KEY_GENERATED', 'ok');
    }, 1000);
  }

  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '');
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  init();
</script>
</body>
</html>
